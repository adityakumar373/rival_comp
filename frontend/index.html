<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- SEO & AEO / GEO Meta Tags -->
    <title>Rival Comp — AI Competitor Intelligence & Market Monitoring Platform</title>
    <meta name="description"
        content="Rival Comp is an enterprise AI competitor intelligence platform that automatically tracks competitor pricing changes, product releases, hiring surges, and strategic shifts in real time.">
    <meta name="keywords"
        content="competitor intelligence, AI competitor tracking, market monitoring, web scraping intelligence, pricing tracking, hiring surge analytics">
    <meta name="author" content="Rival Comp Platform">

    <!-- OpenGraph / Social Meta Tags -->
    <meta property="og:title" content="Rival Comp — Continuous AI Competitor Intelligence">
    <meta property="og:description"
        content="Track competitor products, pricing, hiring, and strategic shifts automatically with real-time web scraping and Gemini AI analysis.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="http://127.0.0.1:8000">

    <!-- Twitter Card Meta -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Rival Comp — AI Competitor Intelligence">
    <meta name="twitter:description" content="Continuous AI competitor tracking and market intelligence platform.">

    <!-- Schema.org Structured Data for SEO / AEO / GEO (SearchGPT, Perplexity, Google SGE) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "Rival Comp",
      "operatingSystem": "Web Browser",
      "applicationCategory": "BusinessApplication",
      "description": "Continuous AI Competitor Intelligence and Market Shift Monitoring Platform.",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      }
    }
    </script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [{
        "@type": "Question",
        "name": "What is Rival Comp?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Rival Comp is an AI-powered competitor intelligence platform that scrapes competitor websites, pricing pages, blogs, and career portals, diffs content changes, and uses Gemini AI to score and summarize business impact."
        }
      }, {
        "@type": "Question",
        "name": "How does competitor tracking work?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Simply type any company name. Rival Comp automatically discovers official website sources and recommended competitors, monitors text changes using SHA-256 hashes and line-by-line diffs, and generates classified strategic insights."
        }
      }]
    }
    </script>

    <!-- Typography & Styles -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/css/styles.css">
</head>

<body>
    <!-- Top Navigation Bar -->
    <header class="navbar" id="navbar">
        <div class="navbar-container">
            <a href="#home" class="navbar-brand">
                <svg width="30" height="30" viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect width="28" height="28" rx="8" fill="#4f7cff" fill-opacity="0.15" />
                    <path d="M14 6L7 10V18L14 22L21 18V10L14 6Z" stroke="#4f7cff" stroke-width="2"
                        stroke-linejoin="round" />
                    <circle cx="14" cy="14" r="3" fill="#4f7cff" />
                </svg>
                <span class="brand-text">Rival<span class="brand-highlight">Comp</span></span>
            </a>

            <!-- Desktop Nav Links -->
            <nav class="navbar-links" id="navbar-links">
                <a href="#home" id="nav-home" class="nav-link active">Home</a>
                <a href="#my-company" id="nav-my-company" class="nav-link">My Company</a>
                <a href="#dashboard" id="nav-dashboard" class="nav-link">Companies</a>
                <a href="#alerts" id="nav-alerts" class="nav-link">Alerts</a>
                <a href="#compare" id="nav-compare" class="nav-link">Compare</a>
                <a href="#analytics" id="nav-analytics" class="nav-link">Analytics</a>
                <a href="#pricing" id="nav-pricing" class="nav-link">Pricing</a>
            </nav>

            <!-- Nav Actions / Search & Auth -->
            <div class="navbar-actions">
                <!-- Expandable Animated Search Bar (Left side of actions) -->
                <div class="navbar-search-wrapper" id="navbar-search-wrapper">
                    <button class="navbar-search-toggle" id="navbar-search-toggle" onclick="App.toggleNavbarSearch(true)" aria-label="Search companies" title="Search company">
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                        </svg>
                    </button>
                    <form class="navbar-search-form" id="navbar-search-form" onsubmit="App.handleNavbarSearchSubmit(event)" autocomplete="off">
                        <svg class="navbar-search-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                        </svg>
                        <input type="text" id="navbar-search-input" class="navbar-search-input" placeholder="Search company..." oninput="App.handleNavbarTypeaheadInput(event)">
                        <button type="button" class="navbar-search-close" onclick="App.toggleNavbarSearch(false)" aria-label="Close search">✕</button>
                    </form>
                    <div class="navbar-autocomplete-dropdown" id="navbar-autocomplete-dropdown"></div>
                </div>

                <!-- Login / Signup (Right side of actions) -->
                <button class="btn btn-secondary btn-sm" onclick="App.showLoginModal()">Login / Signup</button>
                
                <button class="hamburger-btn" id="hamburger-btn" onclick="App.toggleMobileNav()"
                    aria-label="Toggle Navigation">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="3" y1="6" x2="21" y2="6" />
                        <line x1="3" y1="12" x2="21" y2="12" />
                        <line x1="3" y1="18" x2="21" y2="18" />
                    </svg>
                </button>
            </div>
        </div>

        <!-- Mobile Dropdown Navigation -->
        <div class="mobile-dropdown" id="mobile-dropdown">
            <a href="#home" onclick="App.toggleMobileNav()" class="mobile-nav-link">Home</a>
            <a href="#my-company" onclick="App.toggleMobileNav()" class="mobile-nav-link">🏢 My Company Profile</a>
            <a href="#dashboard" onclick="App.toggleMobileNav()" class="mobile-nav-link">Companies List</a>
            <a href="#alerts" onclick="App.toggleMobileNav()" class="mobile-nav-link">🔔 Alerts</a>
            <a href="#compare" onclick="App.toggleMobileNav()" class="mobile-nav-link">Compare Companies</a>
            <a href="#analytics" onclick="App.toggleMobileNav()" class="mobile-nav-link">Analytics & Trends</a>
            <a href="#pricing" onclick="App.toggleMobileNav()" class="mobile-nav-link">Pricing Plans</a>
            <div class="mobile-dropdown-footer">
                <button class="btn btn-primary w-full" onclick="App.toggleMobileNav(); App.showLoginModal();">Login / Signup</button>
            </div>
        </div>
    </header>

    <!-- Main View Area -->
    <main class="main-container" id="main-content">
        <div class="loading-initial">
            <div class="spinner"></div>
            <p class="text-secondary mt-2">Initializing Rival Comp Platform…</p>
        </div>
    </main>

    <!-- Modal Container -->
    <div id="modal-container"></div>

    <!-- Toast Notification Container -->
    <div class="toast-container" id="toast-container"></div>

    <!-- Scripts (Strict Vanilla ES Modules) -->
    <script type="module" src="/js/app.js"></script>
</body>

</html>
